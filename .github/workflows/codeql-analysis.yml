name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 9 * * 3'

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libxml2-dev zlib1g-dev
      - name: Build and verify SetupDB
        run: |
          ./autogen.sh
          ./configure
          make -j2 all convert check
      - uses: github/codeql-action/analyze@v4
